# Compiles the app's Icon Composer files into the Assets.car files builds use (scripts/compile-icons.sh). It needs
# Xcode 26's actool, which GitHub's Mac has, so it runs there by hand when an icon changes; download the artifact and
# commit its files over src-tauri/icons.
name: Icons

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/compile-icons.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icons
          path: |
            src-tauri/icons/Assets.car
            src-tauri/icons/Assets.car.sha256
            src-tauri/icons/channels/*/Assets.car
            src-tauri/icons/channels/*/Assets.car.sha256
          if-no-files-found: error
