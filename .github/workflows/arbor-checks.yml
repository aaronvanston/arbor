# Checks each pull request and push to main with bun run verify, the third-party notices and bun run build, on GitHub's
# Linux runners: Linux minutes are the cheapest a private repository is billed. The Rust tests need a Mac (the app links
# against AppKit), so they run in the Release workflow's build on its macOS runner, before every nightly and stable.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Sessions push to main often; a newer push replaces a check still running for an older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Without HUGEICONS_LICENSE_KEY the optional Pro icons don't install and the free ones stand in.
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Check the third-party notices
        run: bun scripts/third-party-notices.mjs --check
      # The only gate that compiles src/styles.css; a release reaches it only at the end of its build.
      - run: bun run build
