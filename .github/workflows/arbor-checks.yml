# Checks each pull request and push to main with bun run verify and bun run verify:rust. GitHub bills a private
# repository's macOS minutes, so this runs once the repository is public.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            core-plugins/arbor-models
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Without HUGEICONS_LICENSE_KEY the optional Pro icons don't install and the free ones stand in.
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run verify:rust
      - name: Check the third-party notices
        run: bun scripts/third-party-notices.mjs --check
