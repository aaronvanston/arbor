# Arbor's releases, modeled on T3 Code's. Sessions only push to main; this workflow does the releasing.
#
# Nightly: checked once a day, and published as X.Y.Z-nightly.YYYYMMDD.N, a prerelease that apps on the nightly channel
# take, once main has moved past the newest build and 20 hours have passed since the newest nightly
# (scripts/release-plan.mjs). Nothing is committed for it.
#
# Stable: run by hand (scripts/release-stable.sh, or Run workflow with channel stable and the notes). It promotes the
# newest nightly: the same commit, built as X.Y.Z (or the next minor or major, with bump), so stable only ships what
# nightly users already run. Once it's out,
# the version and its notes are committed to main as `Release Arbor X.Y.Z`.
#
# Planning and the release commit need only git, Node and gh, so they run on GitHub's Linux runners. Building needs a
# Mac (the app links against AppKit, and bundling uses Xcode's tools), so that job runs on GitHub's macOS runner, which
# a private repository pays for by the minute and a public one doesn't; no build runs on anyone's own machine.
# Building and publishing share a job so the DMG never becomes an artifact, which GitHub would bill for storing. The
# runner is new each time, so rust-cache keeps the Rust builds between runs.
#
# Secrets: ARBOR_RELEASE_SIGNING_KEY signs the update list and is given only to the publish step. HUGEICONS_LICENSE_KEY
# installs the Pro icons, ARBOR_POSTHOG_KEY builds in usage data and crash reports, and POSTHOG_CLI_API_KEY, if set,
# sends the source maps.
name: Release

on:
  schedule:
    # Once a day, early morning in Australia (17:23 UTC). Off minute zero, when GitHub's scheduled jobs are busiest.
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        options: [nightly, stable]
        default: nightly
      bump:
        description: 'Stable only: patch, or the next minor or major for a release that adds features or breaks something'
        type: choice
        options: [patch, minor, major]
        default: patch
      summary:
        description: "Stable only: the release's one-line summary (public)"
        type: string
        required: false
      changes:
        description: 'Stable only: up to three high-level changes, one a line'
        type: string
        required: false

permissions:
  contents: read

# Nightlies queue behind each other so two never build the same commit or publish out of order; a stable release has
# its own group so a waiting nightly never holds it up. Nothing running is canceled.
concurrency:
  group: release-${{ inputs.channel == 'stable' && 'stable' || 'nightly' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'aaronvanston/arbor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          ARBOR_RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}
          ARBOR_RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
          ARBOR_RELEASE_SUMMARY: ${{ inputs.summary }}
          ARBOR_RELEASE_CHANGES: ${{ inputs.changes }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.mjs

  release:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write # creates the release and its tag
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REF: ${{ needs.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # dmgbuild lays out the DMG's window; without uv the build falls back to a plain DMG.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            core-plugins/arbor-models
      # The commit being promoted predates its notes, so the build carries them from the run.
      - name: Add the stable release's notes
        if: inputs.channel == 'stable'
        env:
          ARBOR_RELEASE_SUMMARY: ${{ inputs.summary }}
          ARBOR_RELEASE_CHANGES: ${{ inputs.changes }}
        run: node scripts/release-notes.mjs add --version "$VERSION"
      - name: Install
        env:
          HUGEICONS_LICENSE_KEY: ${{ secrets.HUGEICONS_LICENSE_KEY }}
        run: bun install --frozen-lockfile
      # An official build has the Pro icons and sends usage data.
      - name: Check the release secrets
        env:
          ARBOR_POSTHOG_KEY: ${{ secrets.ARBOR_POSTHOG_KEY }}
        run: |
          [[ -d node_modules/@hugeicons-pro/core-duotone-rounded ]] || { echo "::error::Hugeicons Pro didn't install; is HUGEICONS_LICENSE_KEY set?"; exit 1; }
          [[ -n "$ARBOR_POSTHOG_KEY" ]] || { echo "::error::ARBOR_POSTHOG_KEY isn't set."; exit 1; }
      - run: bun run verify
      - run: bun run verify:rust
      - name: Check the third-party notices
        run: bun scripts/third-party-notices.mjs --check
      - name: Build
        env:
          ARBOR_POSTHOG_KEY: ${{ secrets.ARBOR_POSTHOG_KEY }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: ./scripts/build-release.sh "$VERSION" "$RUNNER_TEMP/release/Arbor-v$VERSION-Darwin-aarch64.dmg"
      - name: Publish
        env:
          ARBOR_RELEASE_SIGNING_KEY: ${{ secrets.ARBOR_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-workflow-release.sh "$VERSION" "$REF" "$RUNNER_TEMP/release/Arbor-v$VERSION-Darwin-aarch64.dmg"

  # After a stable release, main gets its version and notes, so the next nightly is a prerelease of the patch after it
  # and the app's notes card has the summary.
  finalize:
    needs: [plan, release]
    if: inputs.channel == 'stable' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the release commit to main
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Commit the release to main
        env:
          ARBOR_RELEASE_SUMMARY: ${{ inputs.summary }}
          ARBOR_RELEASE_CHANGES: ${{ inputs.changes }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          message="$RUNNER_TEMP/release-message"
          # Sessions push to main too, so a push that loses the race starts again from main's new head.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/set-version.mjs "$VERSION"
            node scripts/release-notes.mjs add --version "$VERSION"
            node scripts/release-notes.mjs commit-message --version "$VERSION" --output "$message"
            git commit -q -F "$message" -- src-tauri/Cargo.toml src-tauri/Cargo.lock release-notes.json
            if git push -q origin HEAD:main; then
              echo "Committed Release Arbor $VERSION to main."
              exit 0
            fi
          done
          echo "::error::Arbor $VERSION is out, but its release commit couldn't be pushed to main; commit it by hand."
          exit 1
