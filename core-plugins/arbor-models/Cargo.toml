[package]
name = "arbor-models"
version = "0.1.0"
description = "Core plugin that adds the extra models Arbor lists to one of the core's providers"
edition = "2021"
publish = false

[lib]
name = "arbor_models"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"

[profile.release]
lto = true
strip = true
