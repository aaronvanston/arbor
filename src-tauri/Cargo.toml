[package]
name = "arbor"
# Single source of truth for the desktop app version.
version = "1.0.6"
description = "Arbor desktop management shell"
authors = ["Aaron Vanston"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
memchr = "2"
notify = "7"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["compress"] }
tar = "0.4"
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
tokio-util = "0.7"
toml = "0.8"
toml_edit = "0.20"
yaml-serde-edit = { version = "0.1", default-features = false }
yaml-edit = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSRunningApplication", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = "0.3"

[dev-dependencies]
# The same muda Tauri builds its menus with, so a test can check which menu accelerators it reads.
muda = { version = "0.19", default-features = false }
